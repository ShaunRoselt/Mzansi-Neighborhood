<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mzansi Neighborhood</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="game-shell">
      <header class="title-strip">
        <div>
          <p class="eyebrow">Mzansi Neighborhood</p>
          <h1>Classic Isometric Household Sim</h1>
        </div>
        <div class="save-card" aria-live="polite">
          <span id="dayLabel">Monday</span>
          <strong id="timeLabel">07:00</strong>
          <span class="funds">§<span id="fundsValue">1200</span></span>
        </div>
      </header>

      <main class="game-layout">
        <section class="world-panel" aria-label="Isometric household view">
          <div class="lot-toolbar">
            <button id="wallsButton" type="button">Walls: Cutaway</button>
            <button id="autonomyButton" type="button">Autonomy: On</button>
          </div>
          <div class="viewport">
            <div id="isoStage" class="iso-stage" aria-live="polite"></div>
          </div>
        </section>

        <aside class="right-console" aria-label="Household information">
          <section>
            <h2>Household</h2>
            <div id="householdList" class="household-list"></div>
          </section>

          <section>
            <h2 id="selectedSimName">Nomsa Dlamini</h2>
            <p id="selectedSimMood" class="mood-line">Settling in</p>
            <div id="needsPanel" class="needs-panel"></div>
          </section>

          <section>
            <h2>Action Queue</h2>
            <ol id="queueList" class="queue-list"></ol>
          </section>

          <section>
            <h2>Buy Catalog</h2>
            <div id="catalogList" class="catalog-list"></div>
          </section>
        </aside>
      </main>

      <footer class="control-bar" aria-label="Classic simulation controls">
        <div class="mode-tabs">
          <button class="active" type="button">Live</button>
          <button type="button" disabled>Build</button>
          <button type="button" disabled>Buy</button>
        </div>
        <div class="speed-controls">
          <button id="pauseButton" type="button" aria-label="Pause simulation">Ⅱ</button>
          <button class="speed-button active" type="button" data-speed="1">1</button>
          <button class="speed-button" type="button" data-speed="2">2</button>
          <button class="speed-button" type="button" data-speed="3">3</button>
        </div>
        <div class="message-feed" aria-label="Household event log">
          <ol id="eventLog"></ol>
        </div>
      </footer>
    </div>

    <template id="needTemplate">
      <article class="need-row">
        <span></span>
        <div class="need-meter"><i></i></div>
        <strong></strong>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
